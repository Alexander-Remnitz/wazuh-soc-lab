# Wazuh agent — Apache log source (deployed on the target, mr-axe)
#
# Added to /var/ossec/etc/ossec.conf on the agent, inside <ossec_config>.
# Needed because the Wazuh Linux agent does NOT monitor Apache logs by
# default, and because the lab's vhost logs to a CUSTOM path
# (project-zero.conf → CustomLog .../project-zero-access.log), not the
# default access.log. Confirm the real path with `apachectl -S` before
# configuring.

<localfile>
  <log_format>apache</log_format>
  <location>/var/log/apache2/project-zero-access.log</location>
</localfile>

# Realtime File Integrity Monitoring — replaces the default periodic
# (12 h) scan of these directories, so file changes are detected instantly.
# Default block is: <directories>/etc,/usr/bin,/usr/sbin</directories>

<directories realtime="yes">/etc,/usr/bin,/usr/sbin</directories>
